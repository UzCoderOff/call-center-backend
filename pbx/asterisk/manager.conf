; Ledger's phone line: the manager interface Ledger uses to run it
; (src/services/pbx/ami.js). Only from this server itself.
; Installed by pbx/install.sh, which puts in the secret from the backend's
; .env (PBX_AMI_SECRET).

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1
displayconnects = no

[ledger]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = system,call,agent,config,reporting
write = system,call,agent,config,originate
