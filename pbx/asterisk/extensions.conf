; Ledger's phone line: what happens to each call.
; Installed by pbx/install.sh (see pbx/README.md) - edit here, then reinstall.
; Ledger writes two files itself (src/services/pbx/config.js):
;   ledger/globals_ledger.conf    LEDGER_HOOK, LEDGER_HOOK_SECRET, PBX_MON,
;                                 PBX_SPOOL, TRUNK_ENABLED, COMPANY_NUMBER,
;                                 PBX_SOUNDS, HAS_GREETING, HAS_COORDINATOR,
;                                 HAS_COORDINATOR_BUSY, HAS_BUSY, HAS_THANKS,
;                                 LINE_NIGHT, FIRM_TZ
;                                 (the firm's voice messages: sounds.js)
;   ledger/extensions_ledger.conf [ledger-hints]: busy/free of each phone ID
;
; Every call that matters to Ledger leaves files in PBX_SPOOL when it ends
; (ledger-call-end, ledger-ring-end below); src/services/pbx/ingest.js turns
; them into calls in Ledger, with the recording from PBX_MON.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
#include ledger/globals_ledger.conf
; The longest a client waits in line (seconds).
QUEUE_MAX_WAIT=180
; How the outside line wants numbers: its prefix before the 9 digits.
TRUNK_PREFIX=998

#include ledger/extensions_ledger.conf

; ===================================================================== in
; The outside line delivers client calls here (pjsip_trunk.conf). It can
; reach nothing else - in particular never [outbound].
[from-trunk]
exten => _X.,1,Goto(company-line,s,1)
exten => _+X.,1,Goto(company-line,s,1)
exten => s,1,Goto(company-line,s,1)

; A client calling the company number: the firm's greeting, then they wait
; in line with music while the operators are rung in turn (queues.conf), and
; the call is recorded while they talk. Outside working hours, or when
; nobody could take it, they leave a message instead ([line-message]).
[company-line]
exten => s,1,Set(CALLERID(num)=${FILTER(0-9+,${CALLERID(num)})})
; SkyLine sends Uzbek numbers as 9 digits: from here on every phone, form and
; call in Ledger sees them as +998XXXXXXXXX.
 same => n,ExecIf($[${LEN(${CALLERID(num)})} = 9]?Set(CALLERID(num)=+998${CALLERID(num)}))
 same => n,ExecIf($[${LEN(${CALLERID(num)})} = 12 & "${CALLERID(num):0:3}" = "998"]?Set(CALLERID(num)=+${CALLERID(num)}))
 same => n,Set(__LEDGER_CALL=${UNIQUEID})
 same => n,Set(__LEDGER_KIND=queue)
 same => n,Set(LEDGER_DIR=in)
 same => n,Set(LEDGER_NUM=${CALLERID(num)})
 same => n,Set(LEDGER_START=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=ledger-call-end,s,1)
; A client Ledger knows: their name on the operator's phone while it rings.
 same => n,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(LEDGER_NAME=${CURL(${LEDGER_HOOK}/caller,s=${LEDGER_HOOK_SECRET}&num=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${LEDGER_NAME}" = ""]?answer)
 same => n,Set(CALLERID(name)=${LEDGER_NAME})
 same => n(answer),Answer()
; Outside working hours (Settings -> Phone line; LINE_NIGHT is e.g.
; "22:00-07:59" in the firm's time, empty when off): nobody is rung.
 same => n,GotoIf($["${LINE_NIGHT}" = ""]?day)
 same => n,GotoIfTime(${LINE_NIGHT},*,*,*,${FIRM_TZ}?line-message,night,1)
; The call, and each side apart for the transcriber (pbx/transcriber): what
; the client says (r) and what they hear - the firm (t).
 same => n(day),MixMonitor(${PBX_MON}/${LEDGER_CALL}.wav,br(${PBX_MON}/${LEDGER_CALL}.client.wav16)t(${PBX_MON}/${LEDGER_CALL}.staff.wav16))
; Whose caller it is (src/services/pbx/route.js answers
; "<phone ID>|<name>|<kind>"): a client with a contract - their coordinator
; (25 s); a second chance or someone thinking it over - their operator (20 s).
; No answer: the call-center line, whose phones say whose caller it was.
 same => n,Set(ROUTE=${CURL(${LEDGER_HOOK}/route,s=${LEDGER_HOOK_SECRET}&num=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(ROUTE_EXT=${FILTER(0-9,${CUT(ROUTE,|,1)})})
 same => n,Set(ROUTE_KIND=${FILTER(a-z,${CUT(ROUTE,|,3)})})
 same => n,Set(ROUTE_COORD=${IF($["${ROUTE_EXT}" != "" & ("${ROUTE_KIND}" = "" | "${ROUTE_KIND}" = "coordinator")]?1:0)})
; The firm's greeting: a client with a contract hears the one that puts
; them through to their coordinator, everyone else the general one.
 same => n,Set(GREETING=${IF($["${HAS_GREETING}" = "1"]?greeting:)})
 same => n,ExecIf($[${ROUTE_COORD} & "${HAS_COORDINATOR}" = "1"]?Set(GREETING=coordinator))
 same => n,ExecIf($["${GREETING}" != ""]?Playback(${PBX_SOUNDS}/${GREETING}))
 same => n,GotoIf($["${ROUTE_EXT}" = ""]?line)
 same => n,Set(__LEDGER_KIND=direct)
 same => n,Set(__LEDGER_XFER_NOTE=${IF(${ROUTE_COORD}?direct:mine:${ROUTE_KIND})})
 same => n,Dial(Local/${ROUTE_EXT}@ring-person/n,${IF(${ROUTE_COORD}?25:20)},m)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
; Their coordinator didn't answer: the client is told so before the call
; center is rung.
 same => n,ExecIf($[${ROUTE_COORD} & "${HAS_COORDINATOR_BUSY}" = "1"]?Playback(${PBX_SOUNDS}/coordinatorBusy))
 same => n,Set(__LEDGER_KIND=queue)
 same => n,Set(__LEDGER_XFER_NOTE=${IF(${ROUTE_COORD}?missed:missedop)}:${CUT(ROUTE,|,2)})
 same => n(line),Queue(callcenter,,,,${QUEUE_MAX_WAIT})
; Nobody took it - no one free, or the wait ran out: the caller leaves a
; message rather than being cut off.
 same => n,GotoIf($["${QUEUESTATUS}" != "" & "${QUEUESTATUS}" != "CONTINUE" & "${HAS_BUSY}" = "1"]?line-message,busy,1)
 same => n(done),Hangup()

; A message from the caller: the firm's night or busy message, the beep,
; then up to 2 minutes of whatever they say (6 s of silence or # ends it;
; hanging up keeps it). The call's end file says so (LEDGER_VM) and
; ingest.js keeps <call>.vm.wav as the missed call's recording, to be
; called back.
[line-message]
exten => night,1,Set(LEDGER_VM=night)
 same => n,Playback(${PBX_SOUNDS}/night)
 same => n,Goto(record,1)
exten => busy,1,Set(LEDGER_VM=busy)
 same => n,Playback(${PBX_SOUNDS}/busy)
 same => n,Goto(record,1)
exten => record,1,Record(${PBX_MON}/${LEDGER_CALL}.vm.wav,6,120,k)
 same => n,ExecIf($["${HAS_THANKS}" = "1"]?Playback(${PBX_SOUNDS}/thanks))
 same => n,Hangup()

; ============================================================ phone tests
; Anyone can try their phone (the numbers are never phone IDs -
; provision.js RESERVED):
;   600  hear yourself: the microphone, mute, the keypad tones
;   601  Ledger rings you back in a few seconds as one of your clients
;   602  the same from a number Ledger doesn't know
; Nothing here is saved as a call.
[phone-tests]
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()
exten => 601,1,Set(TEST_KIND=client)
 same => n,Goto(callback,1)
exten => 602,1,Set(TEST_KIND=unknown)
 same => n,Goto(callback,1)
exten => callback,1,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(OK=${CURL(${LEDGER_HOOK}/test-call,s=${LEDGER_HOOK_SECRET}&ext=${CHANNEL(endpoint)}&kind=${TEST_KIND})})
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Hangup()

; ============================================================ ring a person
; THE way a person is rung - a call-center turn, a colleague, a client for
; their coordinator. If their phone isn't signed in right now, Ledger is
; asked to wake it (Google push to the Ledger app); it answers how many
; seconds to wait for it to sign in ("0": it can't be woken).
[ring-person]
exten => _[2-8]XX,1,Set(LEDGER_RING_EXT=${EXTEN})
 same => n,Set(LEDGER_RING_START=${EPOCH})
 same => n,Set(LEDGER_WAITED=0)
 same => n,Set(LEDGER_RING_STATUS=)
 same => n,Set(CHANNEL(hangup_handler_push)=ledger-ring-end,s,1)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" != ""]?dial)
 same => n,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(WAKE=${FILTER(0-9,${CURL(${LEDGER_HOOK}/wake,s=${LEDGER_HOOK_SECRET}&ext=${EXTEN}&call=${LEDGER_CALL}&from=${URIENCODE(${CALLERID(num)})})})})
 same => n,GotoIf($["${WAKE}" = "" | "${WAKE}" = "0"]?nodevice)
 same => n,Set(UNTIL=$[${EPOCH} + ${WAKE}])
 ; Hung up while waiting (the client left, the queue moved on): not the phone's fault.
 same => n,Set(LEDGER_RING_STATUS=WAKING)
 same => n(wait),Wait(0.25)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" != ""]?woke)
 same => n,GotoIf($[${EPOCH} < ${UNTIL}]?wait)
 same => n,Set(LEDGER_RING_STATUS=WAKE_TIMEOUT)
 same => n,Hangup()
 same => n(woke),Set(LEDGER_WAITED=$[${EPOCH} - ${LEDGER_RING_START}])
 ; From here Dial's own DIALSTATUS / ANSWEREDTIME tell how it went (read by
 ; ledger-ring-end, also when the call ends with someone hanging up).
 same => n(dial),Set(LEDGER_RING_STATUS=)
 ; A call-center turn rings until the queue moves on; anyone else 30 s.
 same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},${IF($["${LEDGER_KIND}" = "queue"]?:30)},b(ledger-headers^s^1))
 same => n,Hangup()
 same => n(nodevice),Set(LEDGER_RING_STATUS=NO_DEVICE)
 same => n,Hangup()

; Tells the app which call a ring belongs to (it matches it to the push), and
; what kind of ring it is: a call passed on ([ledger-transfer]) - who passed
; it ("from:<name>") or, ringing back, who didn't answer it ("back:<name>");
; a client of theirs sent straight to them ("direct"); one their coordinator
; didn't answer, now for the call center ("missed:<name>").
[ledger-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-Ledger-Call)=${LEDGER_CALL})
 same => n,GotoIf($["${LEDGER_XFER_NOTE}" = ""]?done)
 same => n,Set(PJSIP_HEADER(add,X-Ledger-Transfer)=${URIENCODE(${LEDGER_XFER_NOTE})})
 same => n(done),Return()

; ============================================================ passing a call on
; A client's call passed on to a colleague: the call screen's "Ulash" button
; (src/services/pbx/transfer.js moves the client's side of the call here,
; exten = the colleague's phone ID, after setting LEDGER_XFER_BACK - who
; passed it - and the two names). The client hears music while the colleague
; is rung (woken by push if their phone is asleep). Nobody answers: it rings
; whoever passed it on again; still nobody: back in line for the call center.
; The recording and the call's end file stay on the client's side, so it is
; still one call in Ledger (ingest.js reads the rings' kind: transfer,
; transfer_back).
[ledger-transfer]
exten => _[2-8]XX,1,Set(__LEDGER_KIND=transfer)
 same => n,Set(__LEDGER_XFER_NOTE=from:${LEDGER_XFER_FROM_NAME})
 same => n,Dial(Local/${EXTEN}@ring-person/n,30,m)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${LEDGER_XFER_BACK}" = ""]?line)
 same => n,Set(__LEDGER_KIND=transfer_back)
 same => n,Set(__LEDGER_XFER_NOTE=back:${LEDGER_XFER_TO_NAME})
 same => n,Dial(Local/${LEDGER_XFER_BACK}@ring-person/n,20,m)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(line),Set(__LEDGER_KIND=queue)
 same => n,Set(__LEDGER_XFER_NOTE=)
 same => n,Queue(callcenter,,,,${QUEUE_MAX_WAIT})
 same => n(done),Hangup()

; ============================================================ staff phones
; A phone ID that may only call colleagues.
[staff-internal]
exten => _[2-8]XX,1,Goto(colleague,${EXTEN},1)
; 500: the company line as a client would call it - for trying it out.
exten => 500,1,Goto(company-line,s,1)
; The phone tests (exact numbers win over the phone-ID pattern above).
exten => 600,1,Goto(phone-tests,600,1)
exten => 601,1,Goto(phone-tests,601,1)
exten => 602,1,Goto(phone-tests,602,1)
exten => _X.,1,Goto(blocked,s,1)
exten => _+X.,1,Goto(blocked,s,1)

; A phone ID that may also call out: Uzbek numbers only, in any of the
; usual forms (everything else - abroad, emergency, short numbers - is
; refused; the app sends emergency numbers to the phone's own dialer).
[staff-out]
exten => _[2-8]XX,1,Goto(colleague,${EXTEN},1)
exten => 500,1,Goto(company-line,s,1)
; The phone tests (exact numbers win over the phone-ID pattern above).
exten => 600,1,Goto(phone-tests,600,1)
exten => 601,1,Goto(phone-tests,601,1)
exten => 602,1,Goto(phone-tests,602,1)
exten => _+998XXXXXXXXX,1,Goto(outbound,${EXTEN:4},1)
exten => _998XXXXXXXXX,1,Goto(outbound,${EXTEN:3},1)
exten => _8XXXXXXXXX,1,Goto(outbound,${EXTEN:1},1)
exten => _XXXXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _X.,1,Goto(blocked,s,1)
exten => _+X.,1,Goto(blocked,s,1)

; Colleagues calling each other: not recorded, not kept as calls.
[colleague]
exten => _[2-8]XX,1,Set(__LEDGER_CALL=${UNIQUEID})
 same => n,Set(__LEDGER_KIND=internal)
 same => n,Dial(Local/${EXTEN}@ring-person/n,35)
 same => n,Hangup()

; A client's number (9 digits), out through the outside line with the
; company number shown, recorded while they talk.
[outbound]
exten => _XXXXXXXXX,1,GotoIf($["${TRUNK_ENABLED}" != "1"]?blocked,s,1)
 same => n,Set(__LEDGER_CALL=${UNIQUEID})
 same => n,Set(__LEDGER_KIND=out)
 same => n,Set(LEDGER_DIR=out)
 same => n,Set(LEDGER_NUM=+998${EXTEN})
 same => n,Set(LEDGER_EXT=${CHANNEL(endpoint)})
 same => n,Set(LEDGER_START=${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=ledger-call-end,s,1)
 same => n,Set(CALLERID(all)="${COMPANY_NUMBER}" <${COMPANY_NUMBER}>)
 same => n,MixMonitor(${PBX_MON}/${LEDGER_CALL}.wav,br(${PBX_MON}/${LEDGER_CALL}.staff.wav16)t(${PBX_MON}/${LEDGER_CALL}.client.wav16))
 same => n,Dial(PJSIP/${TRUNK_PREFIX}${EXTEN}@skyline,60)
 same => n,Hangup()

; Refused: the app shows "can't call this number" (SIP 403).
[blocked]
exten => s,1,Hangup(21)

; ========================================================== files for Ledger
; When a client call (in) or a call out ends. num is the outside number;
; vm: the caller was asked for a message ([line-message]: night | busy).
[ledger-call-end]
exten => s,1,Set(FILE(${PBX_SPOOL}/${LEDGER_CALL}.call.evt)=v=1&dir=${LEDGER_DIR}&num=${URIENCODE(${LEDGER_NUM})}&ext=${LEDGER_EXT}&start=${LEDGER_START}&end=${EPOCH}&status=${IF($["${LEDGER_DIR}" = "out"]?${DIALSTATUS}:${QUEUESTATUS})}&talk=${IF($["${ANSWEREDTIME}" = ""]?0:${ANSWEREDTIME})}&rec=${LEDGER_CALL}.wav&vm=${LEDGER_VM})
 same => n,Return()

; Each time a phone was rung for a call: how it went - ring-person's own
; word (WAKE_TIMEOUT, NO_DEVICE, WAKING) or Dial's (ANSWER, NOANSWER, BUSY,
; CANCEL, CHANUNAVAIL…), and the talk time.
[ledger-ring-end]
exten => s,1,Set(STATUS=${IF($["${LEDGER_RING_STATUS}" != ""]?${LEDGER_RING_STATUS}:${IF($["${DIALSTATUS}" != ""]?${DIALSTATUS}:CANCEL)})})
 same => n,Set(FILE(${PBX_SPOOL}/${LEDGER_CALL}.ring-${LEDGER_RING_EXT}-${UNIQUEID}.evt)=v=1&ext=${LEDGER_RING_EXT}&rs=${LEDGER_RING_START}&waited=${LEDGER_WAITED}&status=${STATUS}&talk=${IF($["${ANSWEREDTIME}" = ""]?0:${ANSWEREDTIME})}&kind=${LEDGER_KIND}&end=${EPOCH})
 same => n,Return()
