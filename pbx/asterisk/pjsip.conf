; Ledger's phone line: how phones and the outside line connect.
; Installed by pbx/install.sh (see pbx/README.md) - edit here, then reinstall.
; Ledger writes ledger/pjsip_staff.conf itself: one entry per phone that may
; sign in (src/services/pbx/config.js).

[global]
type=global
user_agent=Ledger
default_realm=ledger
endpoint_identifier_order=username,ip

; Staff phones (the Ledger app): TLS only, with a certificate from Ledger's
; own certificate authority (pbx/make-ca.sh), which the app trusts.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5161
cert_file=/etc/asterisk/keys/ledger-pbx.crt
priv_key_file=/etc/asterisk/keys/ledger-pbx.key
method=tlsv1_2

; The outside line (SkyLine). The firewall lets only its addresses in.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5160

; --- staff phones -------------------------------------------------------
; Encrypted calls (SRTP) only, telephone audio (G.711), nothing peer to peer.
[staff-endpoint](!)
type=endpoint
transport=transport-tls
disallow=all
; HD voice from the Ledger app (Opus, G.722) — the staff side is recorded at
; 16 kHz for the call's text; telephone audio for older apps.
allow=opus,g722,alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
dtmf_mode=rfc4733
; A phone that vanished mid-call (lost mobile data) ends the call.
rtp_timeout=60
rtp_timeout_hold=300
device_state_busy_at=1
allow_subscribe=no

[staff-auth](!)
type=auth
auth_type=md5

; One phone at a time per phone ID; a phone signing in replaces the last.
[staff-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
default_expiration=300
minimum_expiration=60
maximum_expiration=600

#include ledger/pjsip_staff.conf

; The outside line, once connected (pbx/README.md, "The outside line").
#tryinclude pjsip_trunk.conf
