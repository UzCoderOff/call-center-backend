; Ledger's phone line: the call-center line clients wait in.
; Installed by pbx/install.sh (see pbx/README.md) - edit here, then reinstall.
;
; The operator who has gone longest without a call rings first (leastrecent,
; the firm's choice 2026-10-04 — fairer than strict turns when one person
; takes long calls). A phone that doesn't answer in `timeout` seconds, or
; whose operator declines, is skipped for the next one (`retry` seconds on);
; busy or unreachable phones aren't rung. The members - who answers the
; company line - are added and removed by Ledger itself
; (src/services/pbx/presence.js): there are none here.

[general]
persistentmembers=yes
shared_lastcall=yes

[callcenter]
strategy=leastrecent
; Includes the few seconds a sleeping Ledger app takes to wake up.
timeout=20
retry=2
wrapuptime=5
ringinuse=no
musicclass=default
announce-frequency=0
autopause=no
; Nobody who can answer: don't keep the client waiting at all.
joinempty=paused,invalid,unavailable
leavewhenempty=paused,invalid,unavailable
; Who answered, for the call's record.
setinterfacevar=yes
